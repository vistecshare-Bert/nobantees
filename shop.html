<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop — NoBan Tees</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body{background:#0a0a0a;color:#fff;margin:0;font-family:sans-serif;}
    .navbar{display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:64px;background:#0a0a0a;border-bottom:1px solid #222;}
    .nav-cart svg{width:22px!important;height:22px!important;}
    .nav-links{display:flex;gap:32px;list-style:none;}
    svg{overflow:visible;}
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <a href="index.html" class="nav-logo">
    <img src="images/no-ban-logo.png" alt="NoBan Tees" class="logo-img">
  </a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="shop.html" class="active">Shop All</a></li>
    <li><a href="shop.html?cat=hoodies">Hoodies</a></li>
    <li><a href="shop.html?cat=shirts">Shirts</a></li>
    <li><a href="shop.html?cat=pants">Pants</a></li>
  </ul>
  <a href="cart.html" class="nav-cart">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
      <line x1="3" y1="6" x2="21" y2="6"/>
      <path d="M16 10a4 4 0 01-8 0"/>
    </svg>
    <span class="cart-count">0</span>
  </a>
</nav>

<!-- SHOP HEADER -->
<div class="shop-hero">
  <h1 class="shop-title" id="shopTitle">All Products</h1>
  <p class="shop-sub" id="shopSub">15 items</p>
</div>

<!-- FILTER TABS -->
<div class="filter-tabs">
  <button class="filter-tab active" data-cat="all">All (15)</button>
  <button class="filter-tab" data-cat="hoodies">Hoodies (5)</button>
  <button class="filter-tab" data-cat="shirts">Shirts (5)</button>
  <button class="filter-tab" data-cat="pants">Pants (5)</button>
</div>

<!-- PRODUCT GRID -->
<div class="shop-grid-section">
  <div class="product-grid" id="shopGrid"></div>
</div>

<!-- FOOTER -->
<footer class="footer">
  <div class="footer-top">
    <div class="footer-brand">
      <a href="index.html" class="nav-logo" style="display:inline-flex;align-items:center;margin-bottom:12px;">
        <img src="images/no-ban-logo.png" alt="NoBan Tees" class="logo-img logo-img-lg">
      </a>
      <p>Street clothing for those who refuse to be silenced.</p>
    </div>
    <div class="footer-col">
      <h4>Shop</h4>
      <ul>
        <li><a href="shop.html?cat=hoodies">Hoodies</a></li>
        <li><a href="shop.html?cat=shirts">Shirts</a></li>
        <li><a href="shop.html?cat=pants">Pants</a></li>
      </ul>
    </div>
    <div class="footer-col">
      <h4>Info</h4>
      <ul>
        <li><a href="#">Shipping Policy</a></li>
        <li><a href="#">Returns</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </div>
  </div>
  <div class="footer-bottom">
    <span>&copy; 2025 NoBan Tees. All rights reserved.</span>
    <span>nobantees.com</span>
  </div>
</footer>

<!-- TOAST -->
<div class="toast" id="toast">
  <strong id="toastTitle">Added to Cart</strong>
  <span id="toastMsg"></span>
</div>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth-modal.js"></script>
<script src="js/product-card.js"></script>
<script>
  const catLabels = { all: 'All Products', hoodies: 'Hoodies', shirts: 'Shirts', pants: 'Pants' };
  let currentCat = 'all';

  function getUrlCat() {
    const p = new URLSearchParams(window.location.search);
    return p.get('cat') || 'all';
  }

  function renderProducts(cat) {
    currentCat = cat;
    const filtered = cat === 'all' ? products : products.filter(p => p.category === cat);
    document.getElementById('shopGrid').innerHTML = filtered.map(makeProductCard).join('');

    const title = catLabels[cat] || 'All Products';
    document.getElementById('shopTitle').textContent = title;
    document.getElementById('shopSub').textContent = filtered.length + ' items';

    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.classList.toggle('active', tab.dataset.cat === cat);
    });

    // Update URL without reload
    const url = cat === 'all' ? 'shop.html' : 'shop.html?cat=' + cat;
    history.replaceState(null, '', url);
  }

  function handleAddToCart(id) {
    const size = document.getElementById('size-' + id).value;
    if (!size) { showToast('Select a size first', '', true); return; }
    const ok = addToCart(id, size);
    if (ok) {
      const p = products.find(x => x.id === id);
      showToast(p.name, 'Size ' + size + ' added to cart');
    }
  }

  function showToast(title, msg, isError) {
    const toast = document.getElementById('toast');
    document.getElementById('toastTitle').textContent = title;
    document.getElementById('toastMsg').textContent = msg;
    toast.style.borderColor = isError ? '#888' : 'var(--red)';
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  document.querySelectorAll('.filter-tab').forEach(tab => {
    tab.addEventListener('click', () => renderProducts(tab.dataset.cat));
  });

  renderProducts(getUrlCat());
</script>
</body>
</html>
